# =============================================================================
#  R E P S   ·   dns-net
# =============================================================================
[package]
name    = "dns-net"
version = "0.3.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "DNS resolver for Rust: sans-IO message encoding and decoding, a cache, UDP and TCP transport over net-io, and DNSSEC awareness."

# Keywords (5 max)
keywords = ["dns", "resolver", "network", "udp", "domain"]

# Fuzz targets and local tooling stay out of the package.
exclude = ["fuzz/", ".github/"]

# Categories
categories = ["network-programming"]

# Links
homepage      = "https://github.com/jamesgober/dns-net"
repository    = "https://github.com/jamesgober/dns-net"
documentation = "https://docs.rs/dns-net"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "dns_net"
path = "src/lib.rs"


[lints.rust]
# cargo-fuzz builds with `--cfg fuzzing`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }


# FEATURE FLAGS
# #################################
[features]
default = ["resolver"]
# The resolver, its cache, the address policies, and the readers of the
# system's DNS configuration. Without it the crate is the codec alone.
resolver = ["dep:net-io", "dep:mod-rand"]
# DNS over TLS (RFC 7858) through tls-net, with the ring provider and the
# Mozilla roots. Off by default: it brings rustls (tls-net's one exception).
tls = ["resolver", "dep:tls-net"]


# DEPENDENCIES
# #################################
[dependencies]
# Sockets and the reactor driver the resolver multiplexes its queries on.
# 0.8.2 is the first that registers UDP sockets on Windows. `udp` for its
# exclusive bind on Windows (PLAN D-020).
net-io   = { version = "0.8.2", default-features = false, features = ["reactor", "udp"], optional = true }
# The operating system's random source, for query ids, source ports, and
# case randomization.
mod-rand = { version = "1.1", default-features = false, features = ["tier3"], optional = true }
# TLS sessions for DNS over TLS, driven without I/O on the resolver's thread.
tls-net  = { version = "0.10", default-features = false, features = ["ring", "webpki-roots"], optional = true }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
proptest = "1"


[[bench]]
name = "codec"
harness = false
required-features = ["resolver"]

[[bench]]
name = "transport"
harness = false
required-features = ["tls"]


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
